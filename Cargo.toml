[package]
name = "knife"
version = "1.0.0"
authors = ["descawed <github@descawed.com>"]
edition = "2021"
description = "A mod for Silent Hill 2: Enhanced Edition that allows James and Maria to use each other's items"
readme = "README.md"
repository = "https://github.com/descawed/sh2-heavens-knife"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
panic = "abort"

[dependencies]
anyhow = "1.0.95"
encoding_rs = "0.8.35"
log = "0.4.25"
memchr = "2.7.4"
simplelog = "0.12.2"
toml = "0.8.19"
windows = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1.19"